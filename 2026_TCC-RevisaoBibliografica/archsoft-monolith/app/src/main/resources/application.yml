spring:
  application:
    name: archsoft-monolith
  profiles:
    default: local

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  opentelemetry:
    resource-attributes:
      service.name: archsoft-monolith
      archsoft.architecture: monolith
      archsoft.scenario: orders-mvp
      archsoft.repo: archsoft-monolith
      deployment.environment: local

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-} runId:%X{runId:-}]"
